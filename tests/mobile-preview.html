<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificação responsiva — Sinezzio</title><style>*{box-sizing:border-box}body{margin:0;background:#e8edf5;font:14px system-ui;color:#182238}header{text-align:center;padding:14px}h1{font-size:17px;margin:0 0 8px}p{font-size:12px;margin:8px}nav{display:flex;justify-content:center;gap:10px}button{font:inherit;border:1px solid #bac9df;border-radius:6px;background:#fff;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#0068d9;color:#fff}.phone{width:390px;max-width:100%;margin:0 auto 20px;border:4px solid #243b53;border-radius:19px;overflow:hidden;box-sizing:content-box}iframe{display:block;width:100%;height:740px;border:0;background:white}</style></head><body><header><h1>Calculadora — tela estreita</h1><nav aria-label="Largura da tela"><button data-width="320" aria-pressed="false">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button></nav><p>Verificação de layout e campos. Não emula o sistema do iPhone.</p></header><div class="phone" id="phone"><iframe title="Calculadora em tela estreita" src="../index.html?v=20261023-mobile"></iframe></div><script>document.querySelectorAll('button[data-width]').forEach(function(button){button.onclick=function(){document.getElementById('phone').style.width=button.dataset.width+'px';document.querySelectorAll('button[data-width]').forEach(function(other){other.setAttribute('aria-pressed',String(other===button));});};});</script></body></html>
